# Production: the app plus a Traefik router. There is deliberately no database
# container here — the app talks to an external Postgres through DATABASE_URL.
services:
  web:
    build: .
    image: ${IMAGE:-kbzhu-web:latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-${PUBLIC_HOST}}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://${PUBLIC_HOST}}
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          python -c "import sys, urllib.request;
          req = urllib.request.Request('http://127.0.0.1:8000/healthz',
          headers={'X-Forwarded-Proto': 'https'});
          sys.exit(0 if urllib.request.urlopen(req).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - traefik-public
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-public
      traefik.http.routers.kbzhu.rule: Host(`${PUBLIC_HOST}`)
      traefik.http.routers.kbzhu.entrypoints: websecure
      traefik.http.routers.kbzhu.tls.certresolver: letsencrypt
      traefik.http.services.kbzhu.loadbalancer.server.port: "8000"
      # Shared middleware chain on the Traefik host; set TRAEFIK_MIDDLEWARES
      # to empty to drop it.
      traefik.http.routers.kbzhu.middlewares: "${TRAEFIK_MIDDLEWARES:-chain-public@file}"

networks:
  traefik-public:
    external: true
