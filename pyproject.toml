[project]
name = "food"
version = "0.0.1"
description = "Семейный трекер КБЖУ"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1,<6.2",
    "dj-database-url>=2.3,<3",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "whitenoise>=6.8,<7",
    "django-htmx>=1.29.0",
]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "django-stubs>=6.1,<7",
    "mypy>=1.15,<2",
    "pre-commit>=4.6.2",
    "ruff>=0.7,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "DJ", "D"]
# Format of docstrings is checked; their presence is a judgement call (see AGENTS.md).
ignore = ["D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "core.tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.coverage.run]
branch = true
source = ["core", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "config/asgi.py",
    "config/wsgi.py",
    # Prod settings are never imported by tests; CI covers them with `check --deploy`.
    "config/settings/prod.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
