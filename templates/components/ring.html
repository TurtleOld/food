{% comment %}ring: Ring, size (px), stroke, r, color (CSS), big (bool){% endcomment %}
{% load nutrition %}
<div class="ring" style="width:{{ size }}px;height:{{ size }}px">
  <svg width="{{ size }}" height="{{ size }}" viewBox="0 0 100 100" role="img" aria-label="{{ ring.label }}">
    <circle class="track" cx="50" cy="50" r="{{ r }}" stroke-width="{{ stroke }}"/>
    <circle class="bar" cx="50" cy="50" r="{{ r }}" stroke-width="{{ stroke }}" pathLength="100"
            stroke="{% if ring.over %}var(--bulma-danger){% else %}{{ color }}{% endif %}" stroke-dasharray="{{ ring.pct }} 100"/>
  </svg>
  <div class="ring-label">
    {% if big %}
      <div class="num ring-value">{{ ring.value|whole }}</div>
      <div class="muted is-size-7">из {{ ring.goal|whole }} ккал</div>
    {% else %}
      <div class="num has-text-weight-bold">{{ ring.value|whole }}</div>
    {% endif %}
  </div>
</div>
