{% extends "base.html" %}

{% block content %}
  <h1>Новая запись — {{ date|date:"d.m.Y" }}</h1>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Добавить</button>
  </form>

  <p><a href="{% url 'core:day_on' date.isoformat %}">Отмена</a></p>
{% endblock %}
