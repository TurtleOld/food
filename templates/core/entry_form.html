{% extends "base.html" %}

{% block content %}
  {% if entry %}
    <h1>Правка записи — {{ entry.product.name }}</h1>
  {% else %}
    <h1>Новая запись — {{ date|date:"d.m.Y" }}</h1>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if entry %}Сохранить{% else %}Добавить{% endif %}</button>
  </form>

  <p><a href="{{ cancel_url }}">Отмена</a></p>
{% endblock %}
