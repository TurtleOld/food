services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kbzhu
      POSTGRES_USER: kbzhu
      POSTGRES_PASSWORD: kbzhu
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbzhu -d kbzhu"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://kbzhu:kbzhu@db:5432/kbzhu
      SECRET_KEY: dev-insecure-secret-key
    volumes:
      - .:/app
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
