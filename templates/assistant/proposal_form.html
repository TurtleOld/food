{% extends "base.html" %}

{% block title %}Правка предложения{% endblock %}

{% block content %}
  <div class="page-head">
    <h1 class="title is-3">
      {% if proposal.kind == "product" %}Правка Предложения Продукта{% else %}Правка Предложения Записи{% endif %}
    </h1>
  </div>

  <form method="post" class="box">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <div class="buttons mt-4">
      <button class="btn-quiet" type="submit">Сохранить</button>
      <a class="btn-quiet" href="{% url 'assistant:proposals' %}">Отмена</a>
    </div>
  </form>
{% endblock %}
