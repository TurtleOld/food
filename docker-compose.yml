x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DATABASE_URL: postgres://food:food@db:5432/food
  SECRET_KEY: dev-insecure-secret-key

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: food
      POSTGRES_USER: food
      POSTGRES_PASSWORD: food
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food -d food"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: >
      sh -c "uv sync --frozen &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment: *app-environment
    volumes:
      - .:/app
      - /app/.venv
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: >
      sh -c "uv sync --frozen &&
             python manage.py db_worker --queue-name '*'"
    environment: *app-environment
    volumes:
      - .:/app
      - /app/.venv
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: .
    command: >
      sh -c "uv sync --frozen &&
             while true; do python manage.py tick; sleep 300; done"
    environment: *app-environment
    volumes:
      - .:/app
      - /app/.venv
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
