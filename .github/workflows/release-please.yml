name: release-please

on:
  push:
    branches: [main]

# Всё делает RELEASE_PLEASE_TOKEN: PR, теги и релизы от GITHUB_TOKEN
# не запускают другие workflow. Шаги после релиза добавлять сюда же
# с условием `if: ${{ steps.release.outputs.release_created }}`.
permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
