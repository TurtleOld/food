{% extends "base.html" %}

{% block title %}Вход — КБЖУ Трекер{% endblock %}

{% block content %}
  <h1>Вход</h1>
  {% if form.errors %}
    <p>Неверное имя пользователя или пароль.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if next %}
      <input type="hidden" name="next" value="{{ next }}">
    {% endif %}
    <button type="submit">Войти</button>
  </form>
{% endblock %}
